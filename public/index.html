<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Vehicle Telemetry Dashboard
    </title>


    <!-- =====================================================
         Leaflet map CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />


    <!-- =====================================================
         Our dashboard CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>


<!-- =========================================================
     Header
     ========================================================= -->

<header>

    <div>

        <h1>
            Vehicle Telemetry Dashboard
        </h1>

        <div class="header-subtitle">
            Live Vehicle Monitoring
        </div>

    </div>


    <div
        id="connectionStatus"
        class="status disconnected"
    >

        Disconnected

    </div>

</header>



<!-- =========================================================
     Main page
     ========================================================= -->

<main class="container">


    <!-- =====================================================
         Telemetry summary cards
         ===================================================== -->

    <section class="telemetry-grid">


        <!-- Frame Number -->

        <div class="card">

            <div class="card-title">
                Frame Number
            </div>

            <div
                id="frameNumber"
                class="card-value"
            >
                --
            </div>

        </div>



        <!-- Speed -->

        <div class="card">

            <div class="card-title">
                Speed
            </div>

            <div class="card-value">

                <span id="speed">
                    --
                </span>

                <span class="unit">
                    km/h
                </span>

            </div>

        </div>



        <!-- Latitude -->

        <div class="card">

            <div class="card-title">
                Latitude
            </div>

            <div
                id="latitude"
                class="card-value coordinate-value"
            >
                --
            </div>

        </div>



        <!-- Longitude -->

        <div class="card">

            <div class="card-title">
                Longitude
            </div>

            <div
                id="longitude"
                class="card-value coordinate-value"
            >
                --
            </div>

        </div>



        <!-- Number of detected objects -->

        <div class="card">

            <div class="card-title">
                Detected Objects
            </div>

            <div
                id="objectCount"
                class="card-value"
            >
                0
            </div>

        </div>


    </section>



    <!-- =====================================================
         Map + Detected Objects
         ===================================================== -->

    <section class="main-display">


        <!-- =================================================
             Map
             ================================================= -->

        <div class="map-panel">

            <div class="panel-header">

                <span>
                    Vehicle Location
                </span>

            </div>


            <div class="map-content">

                <div id="map"></div>

            </div>

        </div>



        <!-- =================================================
             Detected Objects
             ================================================= -->

        <div class="object-panel">


            <div class="object-panel-header">

                <span>
                    Detected Objects
                </span>


                <span
                    id="objectPanelCount"
                    class="object-count-badge"
                >
                    0
                </span>

            </div>



            <!--
                This part scrolls when there are many objects.
            -->

            <div
                id="objectList"
                class="object-list"
            >

                <div class="no-objects">

                    Waiting for detections...

                </div>

            </div>


        </div>


    </section>



    <!-- =====================================================
         Connection information
         ===================================================== -->

    <section class="info-panel">


        <div class="info-item">

            <span class="info-label">
                Vehicle:
            </span>

            <span id="vehicleId">
                vehicle_001
            </span>

        </div>



        <div class="info-item">

            <span class="info-label">
                Last Update:
            </span>

            <span id="lastUpdate">
                --
            </span>

        </div>



        <div class="info-item">

            <span class="info-label">
                Messages Received:
            </span>

            <span id="messageCount">
                0
            </span>

        </div>


    </section>



    <!-- =====================================================
         Raw JSON
         ===================================================== -->

    <section class="raw-container">


        <div class="panel-header">

            Raw Telemetry

        </div>


        <pre id="rawTelemetry">Waiting for telemetry...</pre>


    </section>


</main>



<!-- =========================================================
     Leaflet JavaScript
     ========================================================= -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>



<script>


// ============================================================
// Configuration
// ============================================================

const VEHICLE_ID = "vehicle_001";


// Determine WebSocket protocol automatically.
//
// Render:
//
// https://...
// becomes
// wss://...
//
// Local:
//
// http://localhost:3000
// becomes
// ws://localhost:3000
//

const wsProtocol =
    window.location.protocol === "https:"
        ? "wss:"
        : "ws:";


const WEBSOCKET_URL =
    `${wsProtocol}//${window.location.host}`;

    

// ============================================================
// State
// ============================================================

let socket = null;

let reconnectTimer = null;

let messageCount = 0;



// ============================================================
// Map
// ============================================================

const map =
    L.map(
        "map"
    ).setView(
        [54.7, -6.2],
        10
    );


L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap contributors"

    }

).addTo(map);


let vehicleMarker = null;

let firstPosition = true;



// ============================================================
// Connection status
// ============================================================

function setConnectionStatus(
    text,
    className
) {

    const element =
        document.getElementById(
            "connectionStatus"
        );


    element.textContent =
        text;


    element.className =
        `status ${className}`;
}



// ============================================================
// Connect WebSocket
// ============================================================

function connectWebSocket() {


    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {

        return;
    }


    setConnectionStatus(
        "Connecting...",
        "connecting"
    );


    console.log(
        "Connecting to:",
        WEBSOCKET_URL
    );


    socket =
        new WebSocket(
            WEBSOCKET_URL
        );



    // --------------------------------------------------------
    // Connected
    // --------------------------------------------------------

    socket.onopen = function () {


        console.log(
            "WebSocket connected"
        );


        const handshake = {

            type:
                "handshake",

            role:
                "browser",

            vehicleId:
                VEHICLE_ID

        };


        console.log(
            "Sending browser handshake:",
            handshake
        );


        socket.send(
            JSON.stringify(
                handshake
            )
        );

    };



    // --------------------------------------------------------
    // Message received
    // --------------------------------------------------------

    socket.onmessage = function (
        event
    ) {


        let data;


        try {

            data =
                JSON.parse(
                    event.data
                );

        }
        catch (error) {

            console.error(
                "Invalid JSON received:",
                event.data
            );

            return;
        }



        // ----------------------------------------------------
        // Handshake acknowledgement
        // ----------------------------------------------------

        if (
            data.type ===
            "handshake_ack"
        ) {


            if (
                data.status ===
                "ok"
            ) {

                console.log(
                    "Handshake successful:",
                    data
                );


                setConnectionStatus(
                    "Connected",
                    "connected"
                );

            }


            return;
        }



        // ----------------------------------------------------
        // Telemetry
        // ----------------------------------------------------

        updateDashboard(
            data
        );

    };



    // --------------------------------------------------------
    // Connection closed
    // --------------------------------------------------------

    socket.onclose = function (
        event
    ) {


        console.log(
            "WebSocket closed:",
            event.code,
            event.reason
        );


        setConnectionStatus(
            "Disconnected",
            "disconnected"
        );


        clearTimeout(
            reconnectTimer
        );


        reconnectTimer =
            setTimeout(
                connectWebSocket,
                3000
            );

    };



    // --------------------------------------------------------
    // Error
    // --------------------------------------------------------

    socket.onerror = function (
        error
    ) {

        console.error(
            "WebSocket error:",
            error
        );

    };

}



// ============================================================
// Update dashboard
// ============================================================

function updateDashboard(
    data
) {


    // --------------------------------------------------------
    // Message counter
    // --------------------------------------------------------

    messageCount++;


    document.getElementById(
        "messageCount"
    ).textContent =
        messageCount;



    // --------------------------------------------------------
    // Raw JSON
    // --------------------------------------------------------

    document.getElementById(
        "rawTelemetry"
    ).textContent =
        JSON.stringify(
            data,
            null,
            2
        );



    // --------------------------------------------------------
    // Frame number
    // --------------------------------------------------------

    if (
        data.frameNumber !== undefined
    ) {

        document.getElementById(
            "frameNumber"
        ).textContent =
            data.frameNumber;

    }



    // --------------------------------------------------------
    // Speed
    // --------------------------------------------------------

    if (
        data.speed !== undefined
    ) {

        document.getElementById(
            "speed"
        ).textContent =
            Number(
                data.speed
            ).toFixed(1);

    }



    // --------------------------------------------------------
    // GPS
    // --------------------------------------------------------

    if (
        data.location &&
        data.location.latitude !== undefined &&
        data.location.longitude !== undefined
    ) {


        const latitude =
            Number(
                data.location.latitude
            );


        const longitude =
            Number(
                data.location.longitude
            );


        document.getElementById(
            "latitude"
        ).textContent =
            latitude.toFixed(6);


        document.getElementById(
            "longitude"
        ).textContent =
            longitude.toFixed(6);



        // ----------------------------------------------------
        // Create/update vehicle marker
        // ----------------------------------------------------

        if (!vehicleMarker) {


            vehicleMarker =
                L.marker(
                    [
                        latitude,
                        longitude
                    ]
                ).addTo(
                    map
                );


            vehicleMarker.bindPopup(
                VEHICLE_ID
            );

        }

        else {


            vehicleMarker.setLatLng(
                [
                    latitude,
                    longitude
                ]
            );

        }



        // ----------------------------------------------------
        // Center map only on first GPS position
        // ----------------------------------------------------

        if (
            firstPosition
        ) {


            map.setView(
                [
                    latitude,
                    longitude
                ],
                15
            );


            firstPosition =
                false;

        }

    }



    // --------------------------------------------------------
    // Detected objects
    // --------------------------------------------------------

    updateDetectedObjects(
        data.detectedObjects
    );



    // --------------------------------------------------------
    // Last update time
    // --------------------------------------------------------

    document.getElementById(
        "lastUpdate"
    ).textContent =
        new Date()
            .toLocaleTimeString();

}



// ============================================================
// Update detected object list
// ============================================================

function updateDetectedObjects(
    objects
) {


    const objectList =
        document.getElementById(
            "objectList"
        );


    const objectCount =
        document.getElementById(
            "objectCount"
        );


    const objectPanelCount =
        document.getElementById(
            "objectPanelCount"
        );


    // Remove objects from previous frame

    objectList.innerHTML = "";



    // --------------------------------------------------------
    // No objects detected
    // --------------------------------------------------------

    if (
        !Array.isArray(objects) ||
        objects.length === 0
    ) {


        objectCount.textContent =
            "0";


        objectPanelCount.textContent =
            "0";


        const emptyMessage =
            document.createElement(
                "div"
            );


        emptyMessage.className =
            "no-objects";


        emptyMessage.textContent =
            "No objects detected";


        objectList.appendChild(
            emptyMessage
        );


        return;
    }



    // --------------------------------------------------------
    // Number of objects
    // --------------------------------------------------------

    objectCount.textContent =
        objects.length;


    objectPanelCount.textContent =
        objects.length;



    // --------------------------------------------------------
    // Add each object
    // --------------------------------------------------------

    objects.forEach(
        function (object) {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "object-item";


            // -----------------------------------------------
            // Header
            // -----------------------------------------------

            const header =
                document.createElement(
                    "div"
                );


            header.className =
                "object-item-header";



            const type =
                document.createElement(
                    "span"
                );


            type.className =
                "object-type";


            type.textContent =
                object.type ?? "unknown";



            const id =
                document.createElement(
                    "span"
                );


            id.className =
                "object-id";


            id.textContent =
                `ID ${object.id ?? "--"}`;



            header.appendChild(
                type
            );


            header.appendChild(
                id
            );


            item.appendChild(
                header
            );



            // -----------------------------------------------
            // Bounding box coordinates
            // -----------------------------------------------

            const coordinates =
                document.createElement(
                    "div"
                );


            coordinates.className =
                "object-coordinates";


            coordinates.appendChild(
                createCoordinate(
                    "X",
                    object.x
                )
            );


            coordinates.appendChild(
                createCoordinate(
                    "Y",
                    object.y
                )
            );


            coordinates.appendChild(
                createCoordinate(
                    "Width",
                    object.width
                )
            );


            coordinates.appendChild(
                createCoordinate(
                    "Height",
                    object.height
                )
            );


            item.appendChild(
                coordinates
            );


            objectList.appendChild(
                item
            );

        }
    );

}



// ============================================================
// Create one coordinate display element
// ============================================================

function createCoordinate(
    label,
    value
) {


    const element =
        document.createElement(
            "div"
        );


    const labelElement =
        document.createElement(
            "span"
        );


    labelElement.className =
        "coordinate-label";


    labelElement.textContent =
        `${label}: `;


    element.appendChild(
        labelElement
    );


    element.appendChild(
        document.createTextNode(
            value ?? "--"
        )
    );


    return element;
}



// ============================================================
// Start
// ============================================================

connectWebSocket();


</script>


</body>

</html>
