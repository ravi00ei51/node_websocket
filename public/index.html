<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Vehicle Telemetry Dashboard
    </title>


    <!-- Leaflet -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #111827;

            color:
                #f3f4f6;
        }


        header {

            background:
                #1f2937;

            padding:
                16px 24px;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            border-bottom:
                1px solid #374151;
        }


        header h1 {

            margin: 0;

            font-size:
                22px;
        }


        #connectionStatus {

            padding:
                6px 12px;

            border-radius:
                6px;

            font-size:
                14px;

            font-weight:
                bold;
        }


        .connected {

            background:
                #065f46;

            color:
                #d1fae5;
        }


        .disconnected {

            background:
                #7f1d1d;

            color:
                #fee2e2;
        }


        .connecting {

            background:
                #78350f;

            color:
                #fef3c7;
        }


        .container {

            padding:
                20px;
        }


        /* ================================================= */
        /* Telemetry cards                                   */
        /* ================================================= */


        .telemetry-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap:
                15px;

            margin-bottom:
                20px;
        }


        .card {

            background:
                #1f2937;

            padding:
                18px;

            border-radius:
                10px;

            border:
                1px solid #374151;
        }


        .card-title {

            color:
                #9ca3af;

            font-size:
                13px;

            margin-bottom:
                8px;
        }


        .card-value {

            font-size:
                28px;

            font-weight:
                bold;
        }


        .unit {

            font-size:
                14px;

            color:
                #9ca3af;
        }


        /* ================================================= */
        /* Map                                               */
        /* ================================================= */


        .map-container {

            background:
                #1f2937;

            border-radius:
                10px;

            padding:
                10px;

            border:
                1px solid #374151;

            margin-bottom:
                20px;
        }


        #map {

            height:
                400px;

            border-radius:
                8px;
        }


        /* ================================================= */
        /* Object table                                      */
        /* ================================================= */


        .object-container {

            background:
                #1f2937;

            border:
                1px solid #374151;

            border-radius:
                10px;

            padding:
                15px;

            margin-bottom:
                20px;

            overflow-x:
                auto;
        }


        .object-container h2 {

            margin-top:
                0;
        }


        table {

            width:
                100%;

            border-collapse:
                collapse;
        }


        th {

            text-align:
                left;

            background:
                #111827;

            color:
                #9ca3af;

            padding:
                10px;

            border-bottom:
                1px solid #374151;
        }


        td {

            padding:
                10px;

            border-bottom:
                1px solid #374151;
        }


        tr:last-child td {

            border-bottom:
                none;
        }


        .object-id {

            font-weight:
                bold;

            color:
                #93c5fd;
        }


        /* ================================================= */
        /* Info                                              */
        /* ================================================= */


        .info-panel {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap:
                10px;

            background:
                #1f2937;

            padding:
                15px;

            border-radius:
                10px;

            border:
                1px solid #374151;

            margin-bottom:
                20px;
        }


        .info-label {

            color:
                #9ca3af;
        }


        /* ================================================= */
        /* Raw JSON                                          */
        /* ================================================= */


        .raw-container {

            background:
                #1f2937;

            border:
                1px solid #374151;

            border-radius:
                10px;

            padding:
                15px;
        }


        #rawTelemetry {

            background:
                #030712;

            padding:
                15px;

            border-radius:
                6px;

            overflow-x:
                auto;

            color:
                #93c5fd;
        }

    </style>

</head>


<body>


<header>

    <h1>
        Vehicle Telemetry Dashboard
    </h1>


    <div
        id="connectionStatus"
        class="disconnected">

        Disconnected

    </div>

</header>



<div class="container">


    <!-- ================================================= -->
    <!-- Main telemetry                                    -->
    <!-- ================================================= -->


    <div class="telemetry-grid">


        <div class="card">

            <div class="card-title">
                Frame Number
            </div>

            <div class="card-value"
                 id="frameNumber">

                --

            </div>

        </div>



        <div class="card">

            <div class="card-title">
                Speed
            </div>

            <div class="card-value">

                <span id="speed">
                    --
                </span>

                <span class="unit">
                    km/h
                </span>

            </div>

        </div>



        <div class="card">

            <div class="card-title">
                Detected Objects
            </div>

            <div class="card-value"
                 id="objectCount">

                0

            </div>

        </div>



        <div class="card">

            <div class="card-title">
                Latitude
            </div>

            <div class="card-value"
                 id="latitude">

                --

            </div>

        </div>



        <div class="card">

            <div class="card-title">
                Longitude
            </div>

            <div class="card-value"
                 id="longitude">

                --

            </div>

        </div>


    </div>



    <!-- ================================================= -->
    <!-- Map                                               -->
    <!-- ================================================= -->


    <div class="map-container">

        <div id="map"></div>

    </div>



    <!-- ================================================= -->
    <!-- Detected objects                                  -->
    <!-- ================================================= -->


    <div class="object-container">


        <h2>
            Detected Objects
        </h2>


        <table>


            <thead>

                <tr>

                    <th>ID</th>

                    <th>Type</th>

                    <th>X</th>

                    <th>Y</th>

                    <th>Width</th>

                    <th>Height</th>

                </tr>

            </thead>


            <tbody id="objectTableBody">


                <tr>

                    <td colspan="6">

                        Waiting for detections...

                    </td>

                </tr>


            </tbody>


        </table>


    </div>



    <!-- ================================================= -->
    <!-- Connection information                            -->
    <!-- ================================================= -->


    <div class="info-panel">


        <div>

            <span class="info-label">
                Vehicle:
            </span>

            <span id="vehicleId">
                vehicle_001
            </span>

        </div>


        <div>

            <span class="info-label">
                Last Update:
            </span>

            <span id="lastUpdate">
                --
            </span>

        </div>


        <div>

            <span class="info-label">
                Messages Received:
            </span>

            <span id="messageCount">
                0
            </span>

        </div>


    </div>



    <!-- ================================================= -->
    <!-- Raw telemetry                                     -->
    <!-- ================================================= -->


    <div class="raw-container">


        <h2>
            Raw Telemetry
        </h2>


        <pre id="rawTelemetry">Waiting for telemetry...</pre>


    </div>


</div>



<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


// ============================================================
// Configuration
// ============================================================

const VEHICLE_ID =
    "vehicle_001";


const wsProtocol =
    window.location.protocol === "https:"
        ? "wss:"
        : "ws:";


const WEBSOCKET_URL =
    `${wsProtocol}//${window.location.host}`;

    

// ============================================================
// State
// ============================================================

let socket = null;

let reconnectTimer = null;

let messageCount = 0;



// ============================================================
// Map
// ============================================================

const map =
    L.map(
        "map"
    ).setView(
        [54.7, -6.2],
        10
    );


L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom:
            19,

        attribution:
            "&copy; OpenStreetMap contributors"

    }

).addTo(map);


let vehicleMarker = null;

let firstPosition = true;



// ============================================================
// Connection status
// ============================================================

function setConnectionStatus(
    text,
    className
) {

    const element =
        document.getElementById(
            "connectionStatus"
        );


    element.textContent =
        text;


    element.className =
        className;
}



// ============================================================
// WebSocket connection
// ============================================================

function connectWebSocket() {


    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {

        return;
    }


    setConnectionStatus(
        "Connecting...",
        "connecting"
    );


    socket =
        new WebSocket(
            WEBSOCKET_URL
        );



    // --------------------------------------------------------
    // Connected
    // --------------------------------------------------------

    socket.onopen = function () {


        const handshake = {

            type:
                "handshake",

            role:
                "browser",

            vehicleId:
                VEHICLE_ID

        };


        socket.send(
            JSON.stringify(
                handshake
            )
        );

    };



    // --------------------------------------------------------
    // Incoming message
    // --------------------------------------------------------

    socket.onmessage = function (
        event
    ) {


        let data;


        try {

            data =
                JSON.parse(
                    event.data
                );

        }
        catch (error) {

            console.error(
                "Invalid JSON",
                error
            );

            return;
        }



        // ----------------------------------------------------
        // Handshake acknowledgement
        // ----------------------------------------------------

        if (
            data.type ===
            "handshake_ack"
        ) {


            if (
                data.status ===
                "ok"
            ) {

                setConnectionStatus(
                    "Connected",
                    "connected"
                );

            }


            return;
        }



        updateDashboard(
            data
        );

    };



    // --------------------------------------------------------
    // Closed
    // --------------------------------------------------------

    socket.onclose = function () {


        setConnectionStatus(
            "Disconnected",
            "disconnected"
        );


        clearTimeout(
            reconnectTimer
        );


        reconnectTimer =
            setTimeout(
                connectWebSocket,
                3000
            );

    };



    // --------------------------------------------------------
    // Error
    // --------------------------------------------------------

    socket.onerror = function (
        error
    ) {

        console.error(
            "WebSocket error:",
            error
        );

    };

}



// ============================================================
// Update dashboard
// ============================================================

function updateDashboard(
    data
) {


    messageCount++;


    document.getElementById(
        "messageCount"
    ).textContent =
        messageCount;



    // --------------------------------------------------------
    // Raw JSON
    // --------------------------------------------------------

    document.getElementById(
        "rawTelemetry"
    ).textContent =
        JSON.stringify(
            data,
            null,
            2
        );



    // --------------------------------------------------------
    // Frame number
    // --------------------------------------------------------

    if (
        data.frameNumber !==
        undefined
    ) {

        document.getElementById(
            "frameNumber"
        ).textContent =
            data.frameNumber;

    }



    // --------------------------------------------------------
    // Speed
    // --------------------------------------------------------

    if (
        data.speed !==
        undefined
    ) {

        document.getElementById(
            "speed"
        ).textContent =
            Number(
                data.speed
            ).toFixed(1);

    }



    // --------------------------------------------------------
    // GPS
    // --------------------------------------------------------

    if (
        data.location &&
        data.location.latitude !== undefined &&
        data.location.longitude !== undefined
    ) {


        const latitude =
            Number(
                data.location.latitude
            );


        const longitude =
            Number(
                data.location.longitude
            );


        document.getElementById(
            "latitude"
        ).textContent =
            latitude.toFixed(6);


        document.getElementById(
            "longitude"
        ).textContent =
            longitude.toFixed(6);



        if (!vehicleMarker) {


            vehicleMarker =
                L.marker(
                    [
                        latitude,
                        longitude
                    ]
                ).addTo(
                    map
                );


            vehicleMarker.bindPopup(
                VEHICLE_ID
            );

        }

        else {


            vehicleMarker.setLatLng(
                [
                    latitude,
                    longitude
                ]
            );

        }



        if (
            firstPosition
        ) {


            map.setView(
                [
                    latitude,
                    longitude
                ],
                15
            );


            firstPosition =
                false;

        }

    }



    // --------------------------------------------------------
    // Detected objects
    // --------------------------------------------------------

    updateDetectedObjects(
        data.detectedObjects
    );



    // --------------------------------------------------------
    // Last update
    // --------------------------------------------------------

    document.getElementById(
        "lastUpdate"
    ).textContent =
        new Date()
            .toLocaleTimeString();

}



// ============================================================
// Detected object table
// ============================================================

function updateDetectedObjects(
    objects
) {


    const tableBody =
        document.getElementById(
            "objectTableBody"
        );


    tableBody.innerHTML =
        "";


    if (
        !Array.isArray(objects) ||
        objects.length === 0
    ) {


        document.getElementById(
            "objectCount"
        ).textContent =
            "0";


        const row =
            document.createElement(
                "tr"
            );


        row.innerHTML =
            `<td colspan="6">
                No objects detected
             </td>`;


        tableBody.appendChild(
            row
        );


        return;
    }



    document.getElementById(
        "objectCount"
    ).textContent =
        objects.length;



    objects.forEach(
        function (object) {


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td class="object-id">
                    ${object.id ?? "--"}
                </td>

                <td>
                    ${object.type ?? "--"}
                </td>

                <td>
                    ${object.x ?? "--"}
                </td>

                <td>
                    ${object.y ?? "--"}
                </td>

                <td>
                    ${object.width ?? "--"}
                </td>

                <td>
                    ${object.height ?? "--"}
                </td>

            `;


            tableBody.appendChild(
                row
            );

        }
    );

}



// ============================================================
// Start
// ============================================================

connectWebSocket();


</script>


</body>

</html>
